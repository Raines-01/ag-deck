<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4457ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AG Deck">
<title>AG Deck — Antigravity 控制台</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-screen="list">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div class="brand-text">
        <h1>AG Deck <span class="brand-tag">Antigravity</span></h1>
        <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></div>
      </div>
      <button class="icon-btn desktop-only" id="btn-net" title="手机访问">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-bell" title="完成提醒">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-refresh" title="刷新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>

    <div class="tools">
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
        </svg>
        <input id="search" type="search" placeholder="搜索会话 / 仓库 / 分支" autocomplete="off">
      </div>
      <div class="tabs" id="tabs">
        <button data-filter="all" class="on">全部</button>
        <button data-filter="active">进行中</button>
        <button data-filter="archived">已归档</button>
      </div>
    </div>

    <div class="list" id="list">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <div class="side-foot">
      <button class="btn primary wide" id="btn-new">＋ 新建会话</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <div class="big">◈</div>
      <h2>选择左侧的一个会话</h2>
      <p>这里会显示 Antigravity 正在做什么、做到哪一步，你也可以直接在下面继续下指令。</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script src="/static/app.js"></script>
</body>
</html>
