[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-deck"
version = "1.0.0"
description = "Use Antigravity on your computer from your phone or another machine, over your LAN or Tailscale."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AG Deck contributors" }]
keywords = ["antigravity", "cascade", "dashboard", "ai-agents", "tailscale"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agdeck = "agdeck.cli:main"

[project.urls]
Homepage = "https://github.com/Raines-01/ag-deck"
Issues = "https://github.com/Raines-01/ag-deck/issues"

[tool.setuptools]
packages = ["agdeck"]

[tool.setuptools.package-data]
agdeck = ["static/*"]
